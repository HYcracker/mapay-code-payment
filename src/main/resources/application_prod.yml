spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mapay_nfkwk_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:mapay_nfkwk_db}
    password: ${DB_PASSWORD}

server:
  port: 8080

mpay:
  api-docs:
    enabled: false
  base-url: https://mapay.nfkwk.com

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

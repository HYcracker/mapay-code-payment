<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订单确认 - Mpay</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:#f5f7fb;color:#172033;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #dfe5ef;border-radius:8px;padding:32px;box-shadow:0 16px 42px rgba(20,31,52,.08)}h1{font-size:22px;margin:0 0 20px;text-align:center}.alert{padding:14px 18px;border-radius:6px;margin-bottom:20px;font-weight:600;text-align:center}.alert-error{background:#fff0f0;color:#c91f1f;border:1px solid #fcc}.alert-success{background:#f0fff4;color:#157a3c;border:1px solid #b7ebc9}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf1f7;padding:10px 0;font-size:14px}.row span:first-child{color:#697386}.row strong{text-align:right}.amount{font-size:36px;font-weight:800;text-align:center;margin:18px 0}.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:13px;font-weight:650}.badge-wait{background:#fff3e0;color:#e67e22}.badge-paid{background:#e8f5e9;color:#2e7d32}.badge-expired{background:#f5f5f5;color:#888}.form-group{margin-top:16px}.form-group label{display:block;margin-bottom:6px;font-size:14px;color:#697386}.form-group input{width:100%;padding:10px 12px;border:1px solid #dfe5ef;border-radius:6px;font-size:14px;outline:none}.form-group input:focus{border-color:#1473e6;box-shadow:0 0 0 3px rgba(20,115,230,.1)}.actions{display:flex;gap:10px;margin-top:20px}button,a.btn{border:0;background:#1473e6;color:white;border-radius:6px;padding:12px 18px;cursor:pointer;text-decoration:none;text-align:center;flex:1;font-weight:650;font-size:15px}button:disabled{background:#b8c3d6;cursor:not-allowed}.ghost{background:#e8eef7!important;color:#233149!important}.danger{background:#e53e3e!important}
  </style>
</head>
<body>
  <main class="card">
    <h1>订单确认</h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <th:block th:if="${order != null}">
      <div class="amount">¥<span th:text="${order.reallyPrice}">0.00</span></div>

      <div class="row"><span>平台订单号</span><strong th:text="${order.orderId}"></strong></div>
      <div class="row"><span>商户订单号</span><span th:text="${order.outTradeNo}"></span></div>
      <div class="row"><span>支付方式</span><span th:text="${order.type}"></span></div>
      <div class="row"><span>商品名称</span><span th:text="${order.name}"></span></div>
      <div class="row"><span>订单金额</span><span th:text="${order.money}"></span></div>
      <div class="row"><span>创建时间</span><span th:text="${order.createTime}"></span></div>
      <div class="row">
        <span>订单状态</span>
        <span th:if="${order.state == 1}" class="badge badge-paid">已支付</span>
        <span th:unless="${order.state == 1}">
          <span th:if="${expired}" class="badge badge-expired">已过期</span>
          <span th:unless="${expired}" class="badge badge-wait">等待支付</span>
        </span>
      </div>

      <th:block th:if="${order.state != 1}">
        <div th:if="${expired}" class="alert alert-error" style="font-size:13px;">⚠ 该订单已超过有效时间，仍可手动补单回调</div>
        <form th:action="'/confirm/' + ${token} + '/approve'" method="post">
          <div class="form-group">
            <label for="platformOrder">第三方流水号（选填）</label>
            <input type="text" id="platformOrder" name="platformOrder" placeholder="如银行流水号、交易凭证号等">
          </div>
          <div class="actions">
            <button type="submit">确认支付并回调</button>
          </div>
        </form>
        <p style="text-align:center;color:#697386;font-size:13px;margin-top:14px">
          点击确认后，系统将标记订单为已支付，并异步通知商户系统。
        </p>
      </th:block>

      <th:block th:if="${order.state == 1}">
        <div class="row"><span>支付时间</span><span th:text="${order.payTime}"></span></div>
        <div class="row"><span>流水号</span><span th:text="${order.platformOrder}"></span></div>
        <div th:if="${order.confirmIp != null and !order.confirmIp.isEmpty()}" class="row"><span>确认来源 IP</span><span th:text="${order.confirmIp}"></span></div>
        <div style="text-align:center;margin-top:20px;color:#697386;font-size:14px">该订单已支付，无需重复确认。</div>
      </th:block>
    </th:block>
  </main>
</body>
</html>

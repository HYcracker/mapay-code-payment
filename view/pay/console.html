<script src="/component/layui/layui.js"></script>
<script src="/static/js/awesome-qr.min.js"></script>
<script>
    // 全局变量
    const QR = AwesomeQR.AwesomeQR;
    let environment = detectBrowserEnvironment();
    const payCode = '<?php echo $payUrl; ?>';
    const codeType = '<?php echo htmlentities($code_type); ?>';
    const payType = '<?php echo htmlentities($type); ?>';
    const order = '<?php echo htmlentities($order_id); ?>';
    const payclient = '<?php echo htmlentities($payclient ?? ""); ?>';

    // 环境检测函数
    function detectBrowserEnvironment() {
        const userAgent = navigator.userAgent.toLowerCase();
        let environment = 'other';
        if (userAgent.includes('micromessenger')) {
            if (userAgent.includes('miniprogram')) {
                environment = 'wxapp';
            } else if (userAgent.includes('android') || userAgent.includes('iphone') || userAgent.includes('ipad')) {
                environment = 'wxphone';
            } else {
                environment = 'wxpc';
            }
        } else if (userAgent.includes('aliapp') || userAgent.includes('alipayclient')) {
            if (userAgent.includes('android') || userAgent.includes('iphone') || userAgent.includes('ipad')) {
                environment = 'aliphone';
            } else {
                environment = 'alipc';
            }
        } else if (userAgent.includes('android') || userAgent.includes('iphone') || userAgent.includes('ipad')) {
            if (!userAgent.includes('micromessenger') && !userAgent.includes('aliapp') && !userAgent.includes('qq')) {
                environment = 'phone';
            }
        } else {
            environment = 'pc';
        }
        return environment;
    }

    // 重设环境变量
    environment = detectBrowserEnvironment();
    // 支付宝环境跳转 (保留原有逻辑)
    if (payclient == 'Alipayf' && environment == 'aliphone') {
        window.location.href = payCode;
    }

    // DOM 元素
    const payTypeImg = document.getElementById('payTypeImg');
    const payTypeTextShort = document.getElementById('payTypeTextShort');
    const payTypeFooterText = document.getElementById('payTypeFooterText');
    const payNoteAmount = document.getElementById('payNoteAmount');

    // 设置支付类型展示样式
    function setPayTypeUI() {
        if (payType === 'wxpay') {
            payTypeImg.src = '/static/img/weixin.jpg';
            payTypeTextShort.innerText = '微信支付';
            payTypeFooterText.innerHTML = '<i class="fab fa-weixin"></i> 微信安全支付';
        } else if (payType === 'alipay') {
            payTypeImg.src = '/static/img/alipay.jpg';
            payTypeTextShort.innerText = '支付宝支付';
            payTypeFooterText.innerHTML = '<i class="fab fa-alipay"></i> 支付宝担保交易';
        } else if (payType === 'unionpay') {
            payTypeImg.src = '/static/img/unionpay.jpg';
            payTypeTextShort.innerText = '云闪付';
            payTypeFooterText.innerHTML = '<i class="fas fa-credit-card"></i> 银联云闪付';
        } else {
            payTypeImg.style.display = 'none';
            payTypeTextShort.innerText = '扫码支付';
        }
    }
    setPayTypeUI();

    // 二维码生成 + 订单轮询
    (async () => {
        // 生成二维码
        try {
            if (codeType == 0) {
                if (payType === 'alipay' && environment === 'pc') {
                    const url = new URL(payCode);
                    const queryParams = new URLSearchParams(url.search);
                    const qrcode = queryParams.get('qrcode');
                    const decodedQrcode = decodeURIComponent(qrcode);
                    document.getElementById('qrcode').src = await getQrcode(decodedQrcode, QR);
                } else {
                    document.getElementById('qrcode').src = await getQrcode(payCode, QR);
                }
            } else {
                document.getElementById('qrcode').src = payCode;
            }
        } catch(e) {
            console.warn(e);
            document.getElementById('qrcode').src = payCode;
        }

        // 订单状态轮询
        let orderTimer = 0;
        const queryOrder = async (url) => {
            if (orderTimer) clearTimeout(orderTimer);
            try {
                const res = await fetch(url);
                const jsonData = await res.json();
                orderTimer = setTimeout(() => { queryOrder(url); }, 1200);
                if (jsonData.state === 1) {
                    clearTimeout(orderTimer);
                    layer.closeAll();
                    const timerDiv = document.getElementById('divTime');
                    if (timerDiv) timerDiv.innerHTML = '<i class="fas fa-check-circle"></i> 订单支付成功！即将跳转...';
                    document.getElementById('qrcode').src = '/static/img/pay_ok.png';
                    setTimeout(() => {
                        location.href = jsonData.return_url;
                    }, 1500);
                }
                let passtime = jsonData.passtime;
                if (passtime <= 0) {
                    clearTimeout(orderTimer);
                }
                timer(passtime);
            } catch(e) { console.error(e); }
        };
        queryOrder(`/getOrderState/${order}`);
    })();

    // 倒计时美化
    function timer(passtime) {
        let minute = 0, second = 0;
        if (passtime > 0) {
            minute = Math.floor(passtime / 60);
            second = Math.floor(passtime) - (minute * 60);
        }
        const timerDiv = document.getElementById('divTime');
        if (passtime <= 0) {
            timerDiv.innerHTML = '<i class="fas fa-times-circle" style="color:#e6553e;"></i> 订单二维码已过期，请刷新页面重试';
            timerDiv.classList.add('expired-warning');
            timerDiv.classList.remove('timer-area');
            timerDiv.style.background = '#ffe9e6';
            document.getElementById('qrcode').src = '/static/img/qrcode_timeout.png';
        } else {
            timerDiv.classList.remove('expired-warning');
            timerDiv.style.background = '#f1f4f9';
            timerDiv.classList.add('timer-area');
            timerDiv.innerHTML = `<i class="far fa-hourglass-half"></i> 二维码有效时间：<strong style="color:#2b5be3; font-size:18px;">${minute}</strong>分<strong style="color:#2b5be3; font-size:18px;">${second}</strong>秒，失效勿付`;
        }
    }

    // 生成二维码加强清晰度，稍微调大生成尺寸
    async function getQrcode(text, QR) {
        const qrcodeUrl = await new Promise((resolve) => {
            new QR({
                text: text,
                size: 550,        // 加大生成画布尺寸，提升二维码精度
                colorDark: "#1e2f5e",
                colorLight: "#ffffff",
            }).draw().then((dataURL) => { resolve(dataURL); });
        });
        return qrcodeUrl;
    }

    // 客服微信复制功能 (非弹窗优雅提示)
    const copyBtn = document.getElementById('copyWechatBtn');
    if (copyBtn) {
        copyBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const wechatId = 'hanyi20240';
            // 使用现代复制API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(wechatId).then(() => {
                    layer.msg('✅ 微信号 hanyi20240 已复制，可前往微信添加', { icon: 1, time: 2000, shade: 0 });
                }).catch(() => {
                    fallbackCopy(wechatId);
                });
            } else {
                fallbackCopy(wechatId);
            }
        });
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        layer.msg('📋 微信号已复制: hanyi20240', { icon: 1, time: 2000 });
    }

    // 原验证支付结果逻辑保留
    /* <?php if ($patt == 0 && $passtime > 0) { ?> */
    /* <?php if ($patt == 0 && $passtime > 0) { ?> */
    const id = '<?php echo htmlentities($id);?>';
    let retryCount = 0;
    const MAX_RETRY = 3;
    const reVali = (step) => {
        if (retryCount >= MAX_RETRY) return;
        setTimeout(() => {
            retryCount++;
            layer.confirm('是否已完成支付？', { icon: 3, title: '支付确认', closeBtn: 0, btn: ['已支付', '未支付'], skin: 'layui-layer-molv' },
                (index) => {
                    (async () => {
                        const res = await validatePayResult(id, 1);
                        if (res && retryCount < MAX_RETRY) { reVali(30000); }
                    })();
                    layer.close(index);
                }, (index) => {
                    if (retryCount < MAX_RETRY) { reVali(30000); }
                    layer.close(index);
                });
        }, step);
    }
    reVali(60000);
    /* <?php } ?> */

    async function validatePayResult(id, patt) {
        const lay = layer.load(2, { shade: [0.2, '#fff'] });
        let data = { id: id, patt: patt };
        const res1 = await fetch(`/validatePayResult`, { method: 'post', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        const rec1_info = await res1.json();
        const info = await new Promise((resolve) => {
            setTimeout(() => {
                data.patt = 0;
                fetch(`/validatePayResult`, { method: 'post', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
                    .then((res2) => res2.json()).then((rec2_info) => {
                    layer.close(lay);
                    if (rec2_info.code == 0) {
                        layer.msg('验证失败，稍后重新验证', { icon: 2, time: 2000 });
                        resolve(true);
                    } else {
                        layer.msg(rec2_info.msg, { icon: 1, time: 2000 });
                        resolve(false);
                    }
                }).catch(()=>{ layer.close(lay); resolve(false); });
            }, 5000);
        });
        return info;
    }
    /* <?php } ?> */

    // 环境警告弹窗
    if (payType === 'wxpay' && environment === 'aliphone') {
        layer.alert('当前为支付宝环境，请使用微信客户端扫码支付', { icon: 0, title: '提示' });
    } else if (payType === 'alipay' && environment === 'wxphone') {
        layer.alert('当前为微信环境，请使用支付宝客户端扫码支付', { icon: 0, title: '提示' });
    }

    // 手机浏览器唤起App按钮控制
    const openAppWrapper = document.getElementById('openAppWrapper');
    const openAppBtn = document.getElementById('openApp');
    if (environment === 'phone') {
        openAppWrapper.style.display = 'block';
        if (payType === 'wxpay') {
            openAppBtn.innerHTML = '<i class="fab fa-weixin"></i> 截图并打开微信支付';
            openAppBtn.onclick = function () {
                window.location.href = 'weixin://';
            };
        } else if (payType === 'alipay') {
            openAppBtn.innerHTML = '<i class="fab fa-alipay"></i> 打开支付宝付款';
            openAppBtn.onclick = function () {
                if (codeType == 0) {
                    const payUrl = encodeURIComponent(payCode);
                    window.location.href = 'alipays://platformapi/startapp?appId=20000067&&url=' + payUrl;
                } else {
                    const currentUrl = encodeURIComponent(window.location.href);
                    window.location.href = 'alipays://platformapi/startapp?appId=20000067&&url=' + currentUrl;
                }
            };
        } else if (payType === 'unionpay') {
            openAppBtn.innerHTML = '<i class="fas fa-credit-card"></i> 打开云闪付';
            openAppBtn.onclick = function () {
                layer.msg('请手动打开云闪付APP扫码', { icon: 1 });
            };
        }
    } else if ((environment === 'wxphone' && payType === 'wxpay') || (environment === 'aliphone' && payType === 'alipay')) {
        openAppWrapper.style.display = 'none';
    } else {
        openAppWrapper.style.display = 'none';
    }

    // 补齐订单显示 与金额
    const orderSpan = document.getElementById('orderDisplay');
    if (orderSpan && orderSpan.innerText.trim() === '') orderSpan.innerText = '<?php echo htmlentities($out_trade_no); ?>';
    const goodsSpan = document.getElementById('goods_name_display');
    if(goodsSpan && goodsSpan.innerText.trim() === '') goodsSpan.innerText = '<?php echo htmlentities($name); ?>';

    let moneyVal = document.getElementById('moneyAmount')?.innerText;
    if(payNoteAmount && moneyVal) payNoteAmount.innerText = moneyVal;

    // 二维码出错后备
    const qrcodeImg = document.getElementById('qrcode');
    if(qrcodeImg) {
        qrcodeImg.onerror = function() {
            if(this.src !== '/static/img/qrcode_timeout.png' && this.src !== '/static/img/pay_ok.png') {
                this.src = '/static/img/loading.gif';
            }
        };
    }
</script>

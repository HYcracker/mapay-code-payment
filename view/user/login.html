<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>登录</title>
	<!-- 样 式 文 件 -->
	<link rel="stylesheet" href="/component/pear/css/pear.css" />
	<link rel="stylesheet" href="/admin/css/other/login.css" />
	<style>
		* {
			box-sizing: border-box;
		}

		body.login-page {
			min-height: 100vh;
			margin: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 2px;
			background:
				linear-gradient(135deg, rgba(95, 184, 120, .10), rgba(44, 95, 122, .08)),
				#f5f7f4;
			font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
		}

		.login-shell {
			width: min(420px, 100%);
			padding: 34px 34px 28px;
			border: 1px solid rgba(24, 39, 33, .08);
			border-radius: 14px;
			background: rgba(255, 255, 255, .94);
			box-shadow: 0 24px 70px rgba(27, 43, 35, .12);
			backdrop-filter: blur(10px);
		}

		.login-brand {
			text-align: center;
			margin-bottom: 28px;
		}

		.login-title {
			margin: 14px 0 6px;
			font-size: 24px;
			font-weight: 700;
			color: #1e3328;
			letter-spacing: 0;
		}

		.desc {
			color: #718078;
			font-size: 14px;
			letter-spacing: 0;
		}

		.layui-form-item {
			margin-bottom: 18px;
		}

		.layui-input {
			height: 46px;
			border: 1px solid #dfe7e2;
			border-radius: 8px;
			padding: 0 14px;
			background: #fbfcfb;
			color: #22342a;
			transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
		}

		.layui-input:focus {
			border-color: #5FB878 !important;
			background: #fff;
			box-shadow: 0 0 0 4px rgba(95, 184, 120, .12);
		}

		.index-txt {
			margin-top: 4px;
			line-height: 18px;
			text-align: right;
		}

		.index-txt>a {
			color: #3a8f5d;
			font-weight: 600;
		}

		.logo1 {
			width: 190px !important;
			max-width: 78%;
		}

		.login {
			width: 100%;
			height: 46px;
			border-radius: 8px !important;
			background: #45a66a !important;
			font-size: 16px;
			font-weight: 700;
			box-shadow: 0 10px 22px rgba(69, 166, 106, .25);
		}

		.login:hover {
			background: #3d985f !important;
		}

		.login-options {
			display: flex;
			align-items: center;
		}

		@media (max-width: 480px) {
			body.login-page {
				padding: 16px;
				align-items: flex-start;
			}

			.login-shell {
				margin-top: 42px;
				padding: 28px 22px 24px;
			}
		}
	</style>
</head>
<!-- 代 码 结 构 -->

<body class="login-page">
	<form class="layui-form login-shell" action="javascript:void(0);">
		<div class="layui-form-item login-brand">
			<img class="logo1" src="/static/img/logo3.png" />
			<div class="login-title">码支付管理后台</div>
			<div class="desc">
				让个人收款更加轻松便捷
			</div>
		</div>
		<div class="layui-form-item">
			<input type="text" name="username" placeholder="账 户" lay-verify="required" hover class="layui-input" />
		</div>
		<div class="layui-form-item">
			<input type="password" name="password" placeholder="密 码" lay-verify="required" hover class="layui-input" />
		</div>
		<div class="layui-form-item layui-row login-options">
			<div class="layui-col-xs6"><input name="keep_login" type="checkbox" title="记住密码" lay-skin="primary" checked>
			</div>
			<div class="layui-col-xs6">
				<div class="index-txt"><a href="/">首 页</a></div>
			</div>
		</div>
		<div class="layui-form-item">
			<button type="submit" class="pear-btn pear-btn-success login" lay-submit lay-filter="login">
				登 入
			</button>
		</div>
	</form>
	<!-- 资 源 引 入 -->
	<script src="/component/layui/layui.js"></script>
	<script src="/component/pear/pear.js"></script>
	<script>
		layui.use(['form', 'button', 'popup'], function () {
			var form = layui.form;
			var button = layui.button;
			var popup = layui.popup;

			// 登 录 提 交
			form.on('submit(login)', function (data) {
				let field = data.field;
				const is_keep = 'keep_login' in field;
				if (!is_keep) {
					field.keep_login = 'off';
				}
				// 动画
				const act_btn = button.load({ elem: '.login' });
				// 登陆
				(async () => {
					const rep_login = await fetch('/api/user/login', { method: 'post', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(field) });
					if (rep_login.status !== 200) {
						popup.failure('请求失败，请重试！');
						act_btn.stop();
						return false;
					}
					const info = await rep_login.json();
					if (info.code === 0) {
						act_btn.stop();
						popup.success("登录成功", function () {
							location.href = "/Console/index"
						});
					} else {
						act_btn.stop();
						popup.failure(info.msg);
					}

				})();
				return false;
			});
		})
	</script>
</body>

</html>
